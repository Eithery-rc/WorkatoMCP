<!doctype html>
<!--
  GitHub social preview (Settings > General > Social preview), 1280x640.
  Re-render after changing it (Chrome wants absolute paths):
    chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1280,640
      --virtual-time-budget=10000 --screenshot=<repo>/docs/assets/social-preview.png
      file:///<repo>/docs/assets/social-preview.html
  then upload the PNG in the repository settings. Keep the tool count in sync with the README.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #141f32;
        --accent: #28b4f6;
        --ink: #f3f7fc;
        --muted: #a9b8cc;
        --faint: #6f8199;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
      }
      body {
        background: var(--bg);
        font-family: 'Inter', 'Segoe UI', sans-serif;
        color: var(--ink);
        position: relative;
      }
      /* soft light behind the mark, and a dot grid that fades toward the text */
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(520px 420px at 290px 320px, rgba(40, 180, 246, 0.16), transparent 70%),
          radial-gradient(900px 500px at 1280px 640px, rgba(40, 180, 246, 0.06), transparent 70%);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(169, 184, 204, 0.16) 1.2px, transparent 1.4px);
        background-size: 28px 28px;
        -webkit-mask-image: linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.9) 0%,
          rgba(0, 0, 0, 0.35) 45%,
          transparent 75%
        );
        mask-image: linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.9) 0%,
          rgba(0, 0, 0, 0.35) 45%,
          transparent 75%
        );
      }
      .mark {
        position: absolute;
        left: 30px;
        top: 50%;
        width: 520px;
        height: 520px;
        transform: translateY(-50%);
        background: url('logo.png') center / cover no-repeat;
        -webkit-mask-image: radial-gradient(closest-side, #000 62%, transparent 100%);
        mask-image: radial-gradient(closest-side, #000 62%, transparent 100%);
      }
      .copy {
        position: absolute;
        left: 532px;
        right: 60px;
        top: 50%;
        transform: translateY(-50%);
      }
      .eyebrow {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-weight: 500;
        font-size: 19px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 18px;
      }
      h1 {
        font-weight: 800;
        font-size: 92px;
        line-height: 1;
        letter-spacing: -0.035em;
        margin-bottom: 26px;
      }
      h1 span {
        color: var(--accent);
      }
      .tagline {
        font-weight: 400;
        font-size: 29px;
        line-height: 1.38;
        color: var(--muted);
        max-width: 640px;
        margin-bottom: 34px;
      }
      .tagline strong {
        color: var(--ink);
        font-weight: 500;
      }
      .chips {
        display: flex;
        flex-wrap: nowrap;
        gap: 11px;
      }
      .chip {
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-weight: 500;
        font-size: 16px;
        color: #d5e7f6;
        padding: 9px 15px;
        white-space: nowrap;
        flex: none;
        border-radius: 999px;
        border: 1px solid rgba(40, 180, 246, 0.38);
        background: rgba(40, 180, 246, 0.08);
      }
      .repo {
        position: absolute;
        right: 60px;
        bottom: 44px;
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 17px;
        color: var(--faint);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="mark"></div>
    <div class="copy">
      <div class="eyebrow">MCP server for Workato</div>
      <h1>Workato<span>MCP</span></h1>
      <p class="tagline"
        >Typed access to your Workato workspace for AI agents,
        <strong>through the browser session you are already signed in to.</strong></p
      >
      <div class="chips">
        <div class="chip">95 Workato tools</div>
        <div class="chip">Chrome extension + bridge</div>
        <div class="chip">No API tokens</div>
      </div>
    </div>
    <div class="repo">github.com/Eithery-rc/WorkatoMCP</div>
  </body>
</html>
