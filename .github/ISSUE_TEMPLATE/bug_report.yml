name: Bug report
description: Something isn't working as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities go through [SECURITY.md](../blob/master/SECURITY.md), not this tracker.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        Called workato_pull_recipe(recipe_id: 12345) and got TabNotFound, with a
        signed-in Workato tab open in the same window.
    validations:
      required: true

  - type: textarea
    id: tool-call
    attributes:
      label: Tool call and response
      description: The call and the error, verbatim. Redact ids and record data as needed.
      render: json

  - type: input
    id: bridge-version
    attributes:
      label: Bridge version
      description: Output of `workatomcp-bridge --version`
      placeholder: 1.11.0
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: Version shown in chrome://extensions. For a source build, add the commit you built from.
      placeholder: 1.11.0 (release zip) or 1.11.0 (f7bc59e)

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Code 2.x / Claude Desktop / Cursor
    validations:
      required: true

  - type: input
    id: region
    attributes:
      label: Workato region
      placeholder: app.workato.com / app.eu.workato.com / custom tenant

  - type: textarea
    id: doctor
    attributes:
      label: Diagnostics
      description: |
        Output of `workatomcp-bridge doctor`. For connection problems,
        `workatomcp-bridge report --copy` produces a fuller redacted report.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: A signed-in Workato app tab was open when the tool was called
        - label: Only one Workato region was open at the time
        - label: The extension and the bridge are on the same release, and the MCP client was restarted after the last update
