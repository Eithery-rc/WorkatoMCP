name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared schemas
        run: pnpm build:shared

      - name: Typecheck bridge and shared schemas
        run: |
          pnpm --filter workatomcp-shared exec tsc --noEmit
          pnpm --filter workatomcp-bridge exec tsc --noEmit

      # The extension still carries ~100 type errors in code inherited from
      # hangwin/mcp-chrome (record-replay-v3, element-marker, gif-recorder).
      # Reported in the run summary, not gating, until that debt is paid down.
      # See docs/ROADMAP.md#known-debt.
      - name: Typecheck extension (reported, not gating)
        run: |
          set +e
          out=$(pnpm --filter workatomcp-extension exec tsc --noEmit 2>&1)
          count=$(printf '%s\n' "$out" | grep -cE 'error TS')
          if [ "$count" -gt 0 ]; then
            {
              echo "### Extension typecheck: $count pre-existing errors"
              echo ""
              echo "Inherited from hangwin/mcp-chrome. See docs/ROADMAP.md#known-debt."
              echo ""
              echo '```'
              printf '%s\n' "$out" | grep -E 'error TS' | head -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Extension typecheck: clean" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Lint
        run: pnpm lint

      - name: Build all packages
        run: pnpm build

      - name: Upload unpacked extension
        if: matrix.node == '20'
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-unpacked
          path: app/chrome-extension/dist/chrome-mv3
          retention-days: 14
